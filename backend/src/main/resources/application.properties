# ==== General ====
quarkus.application.name=digital-twin-backend
quarkus.http.port=8080

# ==== Datasource (PostgreSQL / H2 Fallback) ====
quarkus.datasource.db-kind=${DB_KIND:postgresql}
quarkus.datasource.username=${DB_USERNAME:digital_twin}
quarkus.datasource.password=${DB_PASSWORD:digital_twin}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://digital-twin-db:5432/digital_twin}

# ==== Hibernate ORM ====
# Schema is owned by Flyway migrations in db/migration — Hibernate should not manage DDL.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}

# ==== Flyway ====
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration/common,db/migration/${quarkus.datasource.db-kind}

# ==== CORS (frontend dev server) ====
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# ==== OpenAPI / Swagger UI ====
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.path=/api/swagger-ui
quarkus.swagger-ui.always-include=true

# ==== Health & Metrics ====
quarkus.smallrye-health.root-path=/api/health
quarkus.micrometer.export.prometheus.path=/metrics

# ==== Logging ====
quarkus.log.level=INFO
quarkus.log.category."com.bpp.digitaltwin".level=DEBUG
quarkus.log.console.json=false

# ==== JWT (placeholder, not enforced yet in Phase 2) ====
mp.jwt.verify.issuer=${JWT_ISSUER:https://digital-twin.local}
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:digital_twin;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=sa
%dev.quarkus.flyway.locations=db/migration/common,db/migration/h2


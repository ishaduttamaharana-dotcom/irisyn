# PostgreSQL 16 for dev/sandbox deployment
# Using emptyDir — data is ephemeral but avoids EFS permission issues
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-twin-db
  labels:
    app: digital-twin-db
    part-of: digital-twin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: digital-twin-db
  template:
    metadata:
      labels:
        app: digital-twin-db
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: digital_twin
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: digital-twin-backend-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: digital-twin-backend-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: db-data
          emptyDir: {}

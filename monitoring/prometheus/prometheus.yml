# Placeholder Prometheus config — Phase 2 (no real metric collection yet beyond
# the Quarkus default JVM/HTTP metrics exposed at /metrics).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "digital-twin-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

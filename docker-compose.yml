version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: irisyn-db
    environment:
      POSTGRES_DB: digital_twin
      POSTGRES_USER: twinuser
      POSTGRES_PASSWORD: twinpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinuser -d digital_twin"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: irisyn-backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/digital_twin
      QUARKUS_DATASOURCE_USERNAME: twinuser
      QUARKUS_DATASOURCE_PASSWORD: twinpassword
      NODE_ENV: production
      LLM_PROVIDER: LOCAL
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend-service:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: irisyn-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-service

volumes:
  postgres_data:
